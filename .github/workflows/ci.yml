name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Smoke test the API
        run: python tests/smoke.py

      - name: Smoke test the Food module
        run: python tests/food_smoke.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t gymtrack:ci .
      - name: Boot the container and check /health
        run: |
          docker run -d --name gymtrack-ci -p 8101:8000 -v "$PWD/data:/data" gymtrack:ci
          for i in $(seq 1 20); do
            code=$(curl -so /dev/null -w '%{http_code}' http://localhost:8101/health || true)
            if [ "$code" = "200" ]; then
              echo "healthy"
              curl -sf http://localhost:8101/api/config
              curl -sf "http://localhost:8101/api/food/search?q=test"
              code=$(curl -so /dev/null -w '%{http_code}' -F image=@static/index.html http://localhost:8101/api/food/recognize)
              [ "$code" = "501" ] || { echo "recognize should be 501, got $code"; exit 1; }
              docker exec gymtrack-ci python -c "import zxingcpp, PIL; print('zxing ok')"
              exit 0
            fi
            sleep 1
          done
          docker logs gymtrack-ci
          exit 1
