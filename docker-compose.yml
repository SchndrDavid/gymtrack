name: gymtrack

services:
  gymtrack:
    build: .
    image: gymtrack
    container_name: gymtrack
    restart: unless-stopped
    # Match the UID/GID that owns ./data, otherwise SQLite cannot write.
    user: "${GYMTRACK_UID:-1000}:${GYMTRACK_GID:-1000}"
    ports:
      - "${GYMTRACK_PORT:-8101}:8000"
    volumes:
      - ./data:/data
    environment:
      MORDORCOOK_URL: "${MORDORCOOK_URL:-}"
      FOOD_OFF_LIVE: "${FOOD_OFF_LIVE:-true}"
      FOOD_AI_ENABLED: "${FOOD_AI_ENABLED:-false}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      FOOD_AI_MODEL: "${FOOD_AI_MODEL:-claude-haiku-4-5}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
